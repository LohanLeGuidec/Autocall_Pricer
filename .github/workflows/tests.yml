# Lance la vérification du code (ruff) et les tests (pytest) à chaque push et pull request.
# Les tests n'utilisent pas le réseau : les données Yahoo Finance sont simulées.
name: tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier le code (ruff)
        run: ruff check .

      - name: Lancer les tests (pytest)
        run: pytest
